<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>
<h2>Registration Form</h2>
<form method="post">

    First Name: <input type="text" name="first_name",placeholder="Enter your name"><br><br>
    Middle Name: <input type="text" name="middle_name" placeholder="Enter your Father's name"><br><br>
    Last Name: <input type="text" name="last_name",placeholder="Enter your last name"><br><br>
    Email: <input type="email" name="email" ,placeholder="Enter your email"><br><br>   
    password: <input type="password" name="password" required,placeholder="Enter your password"><br><br>
    phone: <input type="tel" name="phone" ,placeholder="Enter your phone number"><br><
    Comment: <textarea name="comment" rows="5" cols="40" placeholder="Enter your comment"></textarea><br><br>
    
    <input type="submit" value="Register">

</form>
</body>
</html>
